# Deterministic validation for the Watson engine.
#
# Watson is part of the verification trust chain, not a test script beside it: a
# broken classifier waves a privacy regression through, a broken fixture makes an
# invalid world look green, and broken exact-HEAD handling produces a PASS about
# code that was never executed. So the engine gets the same discipline the
# contract does.
#
# Deliberately small. This is not a release system — no publishing, no matrix, no
# browser download. The end-to-end proof that Watson can drive a real product is
# a Watson run against nsc-eval, which needs a database and a built application
# and belongs in that repository's lane, not here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint, parse, unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # `npm ci` would pull Playwright's browser download for a job that never
      # opens one. The engine's unit tests are pure functions over pure inputs.
      - run: npm install --ignore-scripts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run lint
      - run: npm run check
      - run: npm test

  # THE BROWSER IS PART OF THE VERIFIER.
  #
  # Watson drives pages served by the product under verification, so an
  # unsandboxed browser is a hole in the same boundary that protects the
  # evidence — not a lesser, separate concern about the browser.
  #
  # This job exists because "we removed --no-sandbox" is not evidence. It runs
  # the real launch path in the same pinned image and under the same container
  # settings the observer uses, as a non-root user, and then reads the kernel's
  # own account of the renderer processes Chromium forked.
  #
  # If a runner or an image cannot give us a sandboxed non-root browser, the
  # right outcome is a red build and a conversation — not a quietly weakened
  # threat model.
  sandbox:
    name: Browser sandbox boundary (container, non-root)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Diagnostic, printed before the proof so one CI round answers "which knob".
      # Chromium's layer-1 sandbox needs to create an unprivileged user namespace;
      # several container and host settings can block that, and guessing which
      # one wastes rounds.
      - name: Which container settings permit an unprivileged user namespace?
        continue-on-error: true
        env:
          VERIFIER_IMAGE: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
        run: |
          set -uo pipefail
          echo "host: apparmor_restrict_unprivileged_userns = $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '(absent)')"
          echo "host: max_user_namespaces               = $(cat /proc/sys/user/max_user_namespaces 2>/dev/null || echo '(absent)')"
          probe() {
            label="$1"; shift
            out=$(docker run --rm "$@" "$VERIFIER_IMAGE" \
              bash -c 'unshare --user --map-root-user true 2>&1 && echo CREATED' 2>&1 || true)
            printf '%-40s %s\n' "$label" "$(echo "$out" | tail -1)"
          }
          probe "default"                         --security-opt no-new-privileges --cap-drop=NET_RAW
          probe "apparmor=unconfined"             --security-opt no-new-privileges --security-opt apparmor=unconfined --cap-drop=NET_RAW
          probe "seccomp=unconfined"              --security-opt no-new-privileges --security-opt seccomp=unconfined --cap-drop=NET_RAW
          probe "no no-new-privileges"            --cap-drop=NET_RAW
          probe "cap SYS_ADMIN"                   --security-opt no-new-privileges --cap-add=SYS_ADMIN

      - name: Prove the sandbox engages for an unprivileged verifier
        env:
          # The verifier image, pinned by digest exactly as the observer pins it.
          VERIFIER_IMAGE: node:22-bookworm@sha256:8a34c4ab3ea2c5cd194f07e317b2a8f09461d3c8b05c4e34c8ccd56d56024c4d
        run: |
          set -euo pipefail
          docker run --rm \
            --security-opt no-new-privileges \
            --cap-drop=NET_RAW \
            --shm-size=1g \
            -e PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers \
            -v "$PWD:/src:ro" \
            "$VERIFIER_IMAGE" \
            bash -c '
              set -euo pipefail
              # Root does the bootstrap — installs, ownership, users — and then
              # gets out of the way. The verifier itself never runs as root.
              cp -r /src /engine && cd /engine
              npm ci --no-audit --no-fund
              npx playwright install --with-deps chromium
              chmod -R a+rX /opt/pw-browsers /engine
              install -d -o 1000 -g 1000 /home/verifier
              setpriv --reuid=1000 --regid=1000 --init-groups --no-new-privs -- \
                env HOME=/home/verifier PLAYWRIGHT_BROWSERS_PATH=/opt/pw-browsers \
                node test/browser-sandbox-proof.mjs
            '
